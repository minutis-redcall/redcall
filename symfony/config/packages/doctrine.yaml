parameters:
    # Adds a fallback DATABASE_URL if the env var is not set.
    # This allows you to run cache:warmup even if your
    # environment variables are not available yet.
    # You should not need to change this value.
    env(DATABASE_URL): ''

doctrine:
    dbal:
        driver: 'pdo_mysql'
        server_version: '5.7'
        charset: utf8mb4
        default_table_options:
            charset: utf8mb4
            collation: utf8mb4_unicode_ci
        dbname: '%env(resolve:DATABASE_NAME)%'
        host: '%env(resolve:DATABASE_HOST)%'
        port: '%env(resolve:DATABASE_PORT)%'
        user: '%env(resolve:DATABASE_USER)%'
        password: '%env(resolve:DATABASE_PASSWORD)%'
        schema_filter: ~^(?!session)~
        logging: false
        profiling: false
        wrapper_class: 'Facile\DoctrineMySQLComeBack\Doctrine\DBAL\Connection'
        options:
            x_reconnect_attempts: 3
            # Cloud SQL (rdcl-dev-sql1) only accepts encrypted connections
            # (sslMode: ENCRYPTED_ONLY); providing a CA is what makes mysqlnd
            # negotiate TLS. Verification stays off because we reach the
            # instance through its PSC IP, not the DNS name its cert carries.
            !php/const PDO::MYSQL_ATTR_SSL_CA: '%kernel.project_dir%/config/ssl/mysql-server-ca.pem'
            !php/const PDO::MYSQL_ATTR_SSL_VERIFY_SERVER_CERT: false
    orm:
        naming_strategy: doctrine.orm.naming_strategy.underscore
        auto_mapping: true
        mappings:
            App:
                is_bundle: false
                type: attribute
                dir: '%kernel.project_dir%/src/Entity'
                prefix: 'App\Entity'
                alias: App
